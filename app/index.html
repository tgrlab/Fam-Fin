totals=function(m=month(),os=selected()){let t=transferBaseTotals(m,os);t.transferIn=0;t.transferOut=0;for(let r of db.transfers||[]){if(r.month!==m)continue;let a=os.includes(r.from),b=os.includes(r.to);if(a&&!b)t.transferOut+=r.amount;if(b&&!a)t.transferIn+=r.amount;}return t};
function transferSummary(t){return `<div class="row"><span>내부 이체 받음</span><b>${won(t.transferIn)}</b></div><div class="row"><span>내부 이체 보냄</span><b>${won(t.transferOut)}</b></div><small>가족 전체 및 같은 소유자 내 이체는 수입·소비와 잔여금액에 영향을 주지 않습니다.</small>`}
function transferPanel(){let m=month(),wrap=document.createElement('section');wrap.innerHTML=`<details id="transferDetails"><summary style="cursor:pointer;font-weight:650;padding:8px 0">내부 이체 · 부부 간 송금 / 계좌 이동</summary><p class="notice">한 번만 기록하세요. 수입·소비에는 포함하지 않으며 개인별 잔여금액에만 반영합니다. 적금·주식 투자로 이미 기록한 금액은 다시 등록하지 마세요. 자산 잔액은 자동 변경하지 않습니다.</p><label>보낸 사람<select id="trFrom" class="wide">${optsOwner(owners,owner)}</select></label><label>받은 사람<select id="trTo" class="wide">${optsOwner(owners,owner==='본인'?'배우자':'본인')}</select></label><label>출금 계좌 (선택)<input id="trFromAccount" class="wide" placeholder="예: 생활비 통장"></label><label>입금 계좌 (선택)<input id="trToAccount" class="wide" placeholder="예: 공동 통장"></label><small>같은 소유자의 계좌 간 이체는 서로 다른 계좌 이름을 입력하세요.</small><label>금액 (원)<input id="trAmount" class="wide" type="number" min="1" step="1" inputmode="numeric"></label><label>메모 (선택)<input id="trMemo" class="wide" placeholder="예: 11월 생활비"></label><button class="primary" id="trSave">이체 기록 저장</button><button class="wide" id="trCancel" hidden>수정 취소</button><h3>이번 달 이체 내역</h3><div id="trList">${(db.transfers||[]).filter(r=>r.month===m&&(filter==='전체'||r.from===filter||r.to===filter)).map(r=>`<div class="balance-card"><b>${esc(ownerLabel(r.from))} → ${esc(ownerLabel(r.to))}</b><p>${won(r.amount)} · ${esc(r.memo)}</p><small>${esc(r.fromAccount)} → ${esc(r.toAccount)}</small><br><button data-tr-edit="${esc(r.id)}">수정</button> <button data-tr-delete="${esc(r.id)}">삭제</button></div>`).join('')||'<small>등록된 이체 없음</small>'}</div></details>`;$('panel').append(wrap);let editing=null;const read=k=>$(k).value.trim();function clear(){editing=null;$('trAmount').value='';$('trMemo').value='';$('trFromAccount').value='';$('trToAccount').value='';$('trSave').textContent='이체 기록 저장';$('trCancel').hidden=true;}function commit(next){let old=db.transfers;db.transfers=next;if(!save()){db.transfers=old;return false;}render();if($('transferDetails'))$('transferDetails').open=true;return true;}
 $('trSave').onclick=()=>{if(manualDirty())return alert('월간 직접 입력을 먼저 저장하세요.');let from=read('trFrom'),to=read('trTo'),fromAccount=read('trFromAccount'),toAccount=read('trToAccount'),amount=Number(read('trAmount')),memo=read('trMemo');if(!Number.isSafeInteger(amount)||amount<=0)return alert('양의 정수 금액을 입력하세요.');if(from===to&&(!fromAccount||!toAccount||fromAccount===toAccount))return alert('서로 다른 출금·입금 계좌를 입력하세요.');let rs=db.transfers||[],r={id:editing||id(),month:m,from,to,fromAccount,toAccount,amount,memo};if(rs.some(x=>x.id!==editing&&x.month===m&&x.from===from&&x.to===to&&x.amount===amount&&x.fromAccount===fromAccount&&x.toAccount===toAccount)&&!confirm('같은 금액의 이체가 있습니다. 별개의 이체인가요?'))return;commit(editing?rs.map(x=>x.id===editing?r:x):[...rs,r]);};$('trCancel').onclick=clear;wrap.querySelectorAll('[data-tr-edit]').forEach(b=>b.onclick=()=>{let r=(db.transfers||[]).find(x=>x.id===b.dataset.trEdit);editing=r.id;for(let [k,v] of Object.entries({trFrom:r.from,trTo:r.to,trFromAccount:r.fromAccount,trToAccount:r.toAccount,trAmount:r.amount,trMemo:r.memo}))$(k).value=v;$('trSave').textContent='이체 수정 저장';$('trCancel').hidden=false;});wrap.querySelectorAll('[data-tr-delete]').forEach(b=>b.onclick=()=>{if(manualDirty())return alert('월간 직접 입력을 먼저 저장하세요.');if(confirm('이 이체 기록을 삭제할까요?'))commit((db.transfers||[]).filter(x=>x.id!==b.dataset.trDelete));});}
const transferBaseRender=render;render=function(){transferBaseRender();if(tab==='가계부'||tab==='홈'){let t=totals(),target=tab==='홈'?$('body').querySelectorAll('section')[2]:$('body').querySelector('.hero');if(target){let d=document.createElement('div');d.className='flow-net';d.innerHTML=transferSummary(t);target.append(d);}}if(tab==='가계부'&&mode==='manual')transferPanel(); };render();
// Optional household month lock and editable display names. Stored owner IDs remain unchanged.
const closeBaseRender=render;
render=function(){
 closeBaseRender();
 const m=month(),closed=isClosed(m),body=$('body');
 if(tab==='홈'||tab==='가계부'||tab==='자산'||tab==='부채'){
  const box=document.createElement('section');box.innerHTML=`<div class="row"><b>월 기록 ${closed?'확정됨':'미확정'}</b><small>${esc(m)}</small></div><p class="notice">${closed?'이 달의 가계부·자산·부채는 읽기 전용입니다. 수정하려면 확정을 해제하세요.':'마감은 선택입니다. 확정하지 않아도 다음 달을 사용할 수 있습니다.'}</p><button class="wide" id="monthCloseToggle">${closed?'월 기록 확정 해제':'월 기록 확정 (선택)'}</button>`;
  body.prepend(box);
  $('monthCloseToggle').onclick=()=>{if(manualDirty()){alert('월간 직접 입력을 먼저 저장하세요.');return}if(!confirm(closed?'확정을 해제하고 이 달의 기록을 다시 수정할까요?':'이 달의 가족 전체 기록을 확정할까요? 누락된 기록이 없는지 확인하세요.'))return;
   const old=JSON.stringify(db);db.closedMonths??={};if(closed)delete db.closedMonths[m];else{ensureFixed(m);for(const o of owners)state(m,o);db.closedMonths[m]={at:new Date().toISOString()};}
   if(!save()){db=JSON.parse(old);cats=db.cats;incomes=db.incomes;return}parsed=null;render();};
  if(closed){for(const el of body.querySelectorAll('input,select,textarea,button')){if(el.id==='monthCloseToggle'||el.matches('[data-mode],[data-flow]'))continue;el.disabled=true;} }
 }
 if(tab==='더보기'){
  const box=document.createElement('section');box.innerHTML=`<h3>가족 이름 설정</h3><p class="notice">입력·조회 화면에 표시할 이름을 변경합니다. 기존 소유 구분과 기록은 유지됩니다.</p><label>본인 이름<input id="selfName" class="wide" maxlength="20" value="${esc(ownerLabel('본인'))}"></label><label>배우자 이름<input id="partnerName" class="wide" maxlength="20" value="${esc(ownerLabel('배우자'))}"></label><button class="primary" id="saveNames">이름 저장</button><small>공동 항목은 공동으로 표시됩니다. 이름은 로그인 계정과 별개입니다.</small>`;body.prepend(box);
  $('saveNames').onclick=()=>{const a=$('selfName').value.trim(),b=$('partnerName').value.trim();if(!validNames(a,b))return alert('서로 다른 이름을 1~20자로 입력하세요. 전체·공동 및 상대방 기본 구분명은 사용할 수 없습니다.');const old=db.names;db.names={'본인':a,'배우자':b};if(!save()){db.names=old;return}render();};
 }
};render();
</script></html>
